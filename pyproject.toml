[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tooltune-rl"
version = "0.1.0"
description = "Entropy-guided branching for LLM tool-use optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["rank-bm25==0.2.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
train = [
  "torch==2.9.0", "transformers==4.57.6", "trl==0.27.2",
  "peft==0.18.1", "accelerate==1.12.0", "vllm==0.12.0",
  "datasets==4.4.2", "datasketch==1.6.5", "math-verify==0.8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
