<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1100" viewBox="0 0 1360 1100" role="img" aria-labelledby="title desc">
  <title id="title">ToolTune-RL：示范学习、熵引导强化学习与效率微调</title>
  <desc id="desc">Tool-Star示范与Qwen3生成轨迹经筛选形成6,246条LoRA SFT示范。在线训练中，策略调用Python或检索工具，根据工具反馈前后的熵变化选择分支，形成四条候选；正确性与相对调用成本奖励通过DR-GRPO更新策略。随后从已有训练轨迹筛选181条正确低调用示范，混入85条原SFT工具示范，从GRPO模型继续LoRA SFT，冻结候选后评估。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#8a9ab0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L9 5L1 9" fill="none" stroke="#198875" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183550"/><stop offset="1" stop-color="#24476a"/></linearGradient>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243b53}
      .section{font-size:23px;font-weight:650;letter-spacing:1px}
      .label{font-size:23px;font-weight:600;text-anchor:middle}
      .sub{font-size:17px;fill:#72859a;text-anchor:middle}
      .path{fill:none;stroke:#8a9ab0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .loop{fill:none;stroke:#198875;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#teal)}
      .node{fill:#fff;stroke:#d7e1eb;stroke-width:1.5}
    </style>
  </defs>
